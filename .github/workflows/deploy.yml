name: RedwanMart CI Validation (Production Release Held)

# Validation only. Never publish Cloudflare Pages or Workers from a PR.
# A separately owner-approved, exact-SHA release workflow is required.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redwanmart-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout without persisting a write token
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from committed lockfile
        run: npm ci

      - name: Build Astro Cloudflare candidate
        run: npm run build

      - name: Verify a nonempty build artifact and exclude common secrets
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          if find dist -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo "::error::Potential credential file in build output. Release is blocked."
            exit 1
          fi
          echo "Build validation complete. Production publishing remains disabled."
